<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { width: 280px; padding: 20px; font-family: sans-serif; background: #f8f9fa; }
  h1 { font-size: 18px; text-align: center; margin-bottom: 16px; color: #333; }
  .box { background: white; border-radius: 8px; padding: 16px; text-align: center; margin-bottom: 12px; }
  .num { font-size: 32px; font-weight: bold; color: #4CAF50; }
  .lbl { color: #666; font-size: 13px; margin-top: 4px; }
  button { width: 100%; padding: 10px; border: none; border-radius: 6px; background: #4CAF50; color: white; cursor: pointer; }
</style>
</head>
<body>
  <h1>🛡️ 极速广告拦截器</h1>
  <div class="box">
    <div class="num" id="count">0</div>
    <div class="lbl">本次已拦截广告</div>
  </div>
  <button onclick="chrome.tabs.reload(); window.close();">刷新页面</button>
  <script>
    chrome.storage.local.get('blocked', d => document.getElementById('count').textContent = d.blocked || 0);
  </script>
</body>
</html>
